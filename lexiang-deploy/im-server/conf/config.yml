# ============================================================
# 乐享 IM Server - 生产环境配置
# 注意: MySQL 地址使用容器名 mysql (Docker 内部 DNS)
# ============================================================

defaultPort: 9003

nodeName: prod-node-01
nodeHost: im-server  # 容器内主机名
msgStoreEngine: mysql

log:
  logPath: ./logs
  logName: jim-info
  logExpireHours: 168  # 保留7天

kvdb:
  isOpen: true

mysql:
  user: ${MYSQL_USER:-lexiang}
  password: ${MYSQL_PASSWORD}
  address: mysql:3306  # Docker 容器名
  name: jim_db

mongodb:
  address: 127.0.0.1:27017
  name: jim_msgs

apiGateway:
  httpPort: 9001

connectManager:
  wsPort: 9003

adminGateway:
  httpPort: 8090
