# ============================================================
# 乐享 IM - Nginx 生产配置 (api.yefeng.us.cc / admin.yefeng.us.cc)
# 部署: 放置于 /etc/nginx/conf.d/yefeng-us-cc.production.conf
# SSL 证书: Cloudflare Origin Certificate 或 Let's Encrypt
# 注意: 当前生产使用此文件，lexiang.conf 为参考模板请勿直接替换
# ============================================================

# ---------- WebSocket 升级映射（REST 请求时 Connection 保持 close） ----------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------- 限流区域 ----------
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ============================================================
# 主域名 - 重定向到 Cloudflare 前端
# ============================================================
server {
    listen 80;
    server_name yefeng.us.cc www.yefeng.us.cc;
    return 301 https://www.lexiangim.com;
}

server {
    listen 443 ssl http2;
    server_name yefeng.us.cc www.yefeng.us.cc;

    ssl_certificate     /etc/nginx/ssl/yefeng-us-cc.pem;
    ssl_certificate_key /etc/nginx/ssl/yefeng-us-cc.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        return 302 https://www.lexiangim.com;
    }
}

# ============================================================
# 管理后台 (admin.yefeng.us.cc → 8090)
# ============================================================
server {
    listen 80;
    server_name admin.yefeng.us.cc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.yefeng.us.cc;

    ssl_certificate     /etc/nginx/ssl/yefeng-us-cc.pem;
    ssl_certificate_key /etc/nginx/ssl/yefeng-us-cc.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Cloudflare 真实 IP
    set_real_ip_from    10.0.0.0/8;
    set_real_ip_from    172.16.0.0/12;
    set_real_ip_from    192.168.0.0/16;
    set_real_ip_from    100.64.0.0/10;
    set_real_ip_from    24.0.0.0/8;
    set_real_ip_from    31.13.24.0/22;
    set_real_ip_from    31.13.64.0/18;
    set_real_ip_from    64.12.0.0/14;
    set_real_ip_from    66.220.0.0/15;
    set_real_ip_from    69.171.0.0/16;
    set_real_ip_from    72.0.0.0/8;
    set_real_ip_from    103.4.108.0/22;
    set_real_ip_from    104.16.0.0/13;
    set_real_ip_from    108.162.192.0/18;
    set_real_ip_from    131.0.72.0/22;
    set_real_ip_from    141.101.0.0/16;
    set_real_ip_from    151.101.0.0/16;
    set_real_ip_from    162.158.0.0/15;
    set_real_ip_from    172.64.0.0/13;
    set_real_ip_from    173.245.0.0/16;
    set_real_ip_from    188.114.0.0/15;
    set_real_ip_from    197.234.240.0/22;
    set_real_ip_from    198.41.128.0/17;
    set_real_ip_from    203.0.113.0/24;
    set_real_ip_from    240.0.0.0/4;
    real_ip_header      CF-Connecting-IP;
    real_ip_recursive   on;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # ---------- 业务后端 API（/jim/ → 9003，供管理后台AI配置等功能调用） ----------
    location /jim/ {
        proxy_pass http://127.0.0.1:9003;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ---------- 管理后台 API（/admingateway/ → 8090） ----------
    location /admingateway/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_pass_request_headers on;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ---------- 管理后台前端静态资源（/ → 8090） ----------
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://127.0.0.1:8090;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log /var/log/nginx/lexiang-admin-access.log;
    error_log  /var/log/nginx/lexiang-admin-error.log warn;
}

# ============================================================
# API + WebSocket (api.yefeng.us.cc → 9001/9003)
# ============================================================
server {
    listen 80;
    server_name api.yefeng.us.cc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.yefeng.us.cc;

    ssl_certificate     /etc/nginx/ssl/yefeng-us-cc.pem;
    ssl_certificate_key /etc/nginx/ssl/yefeng-us-cc.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ---------- 通用配置 ----------
    client_max_body_size 50m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # ---------- Cloudflare 真实 IP 透传 ----------
    set_real_ip_from    10.0.0.0/8;
    set_real_ip_from    172.16.0.0/12;
    set_real_ip_from    192.168.0.0/16;
    set_real_ip_from    100.64.0.0/10;
    set_real_ip_from    24.0.0.0/8;
    set_real_ip_from    31.13.24.0/22;
    set_real_ip_from    31.13.64.0/18;
    set_real_ip_from    64.12.0.0/14;
    set_real_ip_from    66.220.0.0/15;
    set_real_ip_from    69.171.0.0/16;
    set_real_ip_from    72.0.0.0/8;
    set_real_ip_from    103.4.108.0/22;
    set_real_ip_from    104.16.0.0/13;
    set_real_ip_from    108.162.192.0/18;
    set_real_ip_from    131.0.72.0/22;
    set_real_ip_from    141.101.0.0/16;
    set_real_ip_from    151.101.0.0/16;
    set_real_ip_from    162.158.0.0/15;
    set_real_ip_from    172.64.0.0/13;
    set_real_ip_from    173.245.0.0/16;
    set_real_ip_from    188.114.0.0/15;
    set_real_ip_from    197.234.240.0/22;
    set_real_ip_from    198.41.128.0/17;
    set_real_ip_from    203.0.113.0/24;
    set_real_ip_from    240.0.0.0/4;
    real_ip_header      CF-Connecting-IP;
    real_ip_recursive   on;

    # ---------- CORS（回显请求 Origin，兼容 Credentials） ----------
    # 说明：后端 jugglechat-server/routers/router.go 已移除 CORS 中间件
    #       所有 CORS 头由 Nginx 此处统一设置，避免双重响应头问题
    # 注意：add_header 在 nginx 中不继承父级，因此 server 层设置对所有 location 生效
    add_header Access-Control-Allow-Origin      "https://www.lexiangim.com" always;
    add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers     "appkey, Authorization, Content-Type, version, request-id" always;
    add_header Access-Control-Expose-Headers    "request-id" always;
    add_header Access-Control-Max-Age           "86400" always;
    add_header Access-Control-Allow-Credentials "true" always;

    # OPTIONS 预检请求 nginx 直接返回，不转发后端
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ---------- 业务 API + WebSocket（/jim/ → 9003） ----------
    location /jim/ {
        limit_req zone=api_limit burst=200 nodelay;
        limit_conn conn_limit 50;

        proxy_pass http://127.0.0.1:9003;
        proxy_http_version 1.1;

        # WebSocket 升级头（map 块确保非 WS 请求 Connection=close）
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header CF-Connecting-IP   $http_cf_connecting_ip;
        proxy_pass_request_headers on;

        # WebSocket 长连接超时（3600s），REST API 正常超时
        proxy_connect_timeout  10s;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
        proxy_buffering        off;
    }

    # ---------- REST API（/api/ → 9001） ----------
    location /api/ {
        limit_req zone=api_limit burst=200 nodelay;

        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_pass_request_headers on;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ---------- 静态资源缓存（30天，配合 Vite hash 文件名） ----------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp3)$ {
        proxy_pass         http://127.0.0.1:9003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # 隐藏后端残留的 CORS 头（后端已移除中间件，此处为防御性配置）
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        access_log off;
    }

    # ---------- 健康检查端点（IM SDK 内部使用） ----------
    # 注意：此 location 有自身的 add_header，不会继承 server 层的 add_header
    #       因此此处仍需保留 CORS 头；proxy_hide_header 在此无效（不是 proxy 请求）
    location = /health {
        access_log off;
        add_header Content-Type "application/json" always;
        add_header Access-Control-Allow-Origin      "https://www.lexiangim.com" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, appkey, X-Requested-With" always;
        add_header Access-Control-Max-Age "86400" always;
        return 200 '{"status":"ok"}';
    }

    # ---------- 安全头 ----------
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/lexiang-api-access.log;
    error_log  /var/log/nginx/lexiang-api-error.log warn;
}
