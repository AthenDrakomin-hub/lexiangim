# ============================================================
# 乐享 IM - Nginx 反向代理配置
# 作用: 反向代理 im-server 的 API / WebSocket / 管理后台
# 部署: 放置于 /etc/nginx/conf.d/lexiang.conf
# 前置: 域名已解析到服务器, SSL 证书已配置 (或使用 Cloudflare 代理)
# 当前生产使用 yefeng-us-cc.production.conf，本文件为参考模板
# ============================================================

# ---------- WebSocket 升级映射 ----------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------- 限流区域 (可选, 防刷) ----------
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ============================================================
# API + WebSocket 域名 (api.yefeng.us.cc)
# ============================================================
server {
    listen 80;
    server_name api.yefeng.us.cc;

    # HTTP 强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.yefeng.us.cc;

    # SSL 证书（Cloudflare Origin Certificate 或 Let's Encrypt）
    ssl_certificate     /etc/nginx/ssl/api.yefeng.us.cc.crt;
    ssl_certificate_key /etc/nginx/ssl/api.yefeng.us.cc.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---------- 通用配置 ----------
    client_max_body_size 500m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # ---------- 客户端真实 IP（Cloudflare 透传） ----------
    set_real_ip_from    10.0.0.0/8;
    set_real_ip_from    172.16.0.0/12;
    set_real_ip_from    192.168.0.0/16;
    set_real_ip_from    100.64.0.0/10;
    set_real_ip_from    24.0.0.0/8;
    set_real_ip_from    31.13.24.0/22;
    set_real_ip_from    31.13.64.0/18;
    set_real_ip_from    45.60.0.0/16;
    set_real_ip_from    64.12.0.0/14;
    set_real_ip_from    66.220.0.0/15;
    set_real_ip_from    69.171.0.0/16;
    set_real_ip_from    72.0.0.0/8;
    set_real_ip_from    103.4.108.0/22;
    set_real_ip_from    104.16.0.0/13;
    set_real_ip_from    108.162.192.0/18;
    set_real_ip_from    131.0.72.0/22;
    set_real_ip_from    141.101.0.0/16;
    set_real_ip_from    151.101.0.0/16;
    set_real_ip_from    162.158.0.0/15;
    set_real_ip_from    172.64.0.0/13;
    set_real_ip_from    173.245.0.0/16;
    set_real_ip_from    188.114.0.0/15;
    set_real_ip_from    197.234.240.0/22;
    set_real_ip_from    198.41.128.0/17;
    set_real_ip_from    203.0.113.0/24;
    set_real_ip_from    240.0.0.0/4;
    real_ip_header      CF-Connecting-IP;
    real_ip_recursive   on;

    # ---------- CORS（前端域名 www.lexiangim.com） ----------
    add_header Access-Control-Allow-Origin "https://www.lexiangim.com" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "appkey, Authorization, Content-Type, version, request-id" always;
    add_header Access-Control-Expose-Headers "request-id" always;
    add_header Access-Control-Max-Age "86400" always;
    add_header Access-Control-Allow-Credentials "true" always;

    # OPTIONS 预检请求直接返回
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ---------- 业务 API + WebSocket 长连接（/jim/ → 9003） ----------
    # jugglechat-server 嵌入 im-server，/jim/* 路由同时承载 REST API 和 WebSocket
    location /jim/ {
        limit_req zone=api_limit burst=200 nodelay;
        limit_conn conn_limit 50;

        proxy_pass http://127.0.0.1:9003;
        proxy_http_version 1.1;

        # WebSocket 升级头（REST 请求时 $http_upgrade 为空，Connection 保持原值）
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header CF-Connecting-IP   $http_cf_connecting_ip;

        proxy_pass_request_headers on;

        # WebSocket 长连接超时（7天），REST API 正常超时
        proxy_connect_timeout  10s;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
        proxy_buffering        off;
    }

    # ---------- REST API（/api/ → 9001） ----------
    location /api/ {
        limit_req zone=api_limit burst=200 nodelay;

        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_pass_request_headers on;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ---------- 健康检查 ----------
    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # ---------- 静态资源缓存 ----------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp3)$ {
        proxy_pass         http://127.0.0.1:9003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- 安全头 ----------
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/lexiang-api-access.log;
    error_log  /var/log/nginx/lexiang-api-error.log warn;
}

# ============================================================
# 管理后台域名 (admin.yefeng.us.cc)
# ============================================================
server {
    listen 80;
    server_name admin.yefeng.us.cc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.yefeng.us.cc;

    ssl_certificate     /etc/nginx/ssl/api.yefeng.us.cc.crt;
    ssl_certificate_key /etc/nginx/ssl/api.yefeng.us.cc.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # ---------- 管理后台 API（/admingateway/ → 8090） ----------
    location /admingateway/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_pass_request_headers on;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ---------- 管理后台前端静态资源（/ → 8090） ----------
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://127.0.0.1:8090;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log /var/log/nginx/lexiang-admin-access.log;
    error_log  /var/log/nginx/lexiang-admin-error.log warn;
}
