# ============================================================
# 乐享 IM - MinIO 对象存储 Nginx 反代配置
# 使用方法: 复制到 /etc/nginx/conf.d/minio.conf
# 注意: SSL证书路径需要根据实际情况修改
# ============================================================

server {
    listen 443 ssl http2;
    server_name minio.yefeng.us.cc;

    # SSL证书（使用yefeng.us.cc通配符证书）
    ssl_certificate /etc/letsencrypt/live/yefeng.us.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yefeng.us.cc/privkey.pem;

    # 安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    # 上传大小限制
    client_max_body_size 100m;

    # MinIO API
    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

# MinIO 管理后台（可选，单独端口或路径）
server {
    listen 443 ssl http2;
    server_name minio-console.yefeng.us.cc;

    ssl_certificate /etc/letsencrypt/live/yefeng.us.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yefeng.us.cc/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
