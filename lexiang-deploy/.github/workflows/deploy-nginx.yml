name: Deploy Nginx Config Update

on:
  push:
    branches: [main]
    paths:
      - 'nginx/**'
      - '.github/workflows/*'
  workflow_dispatch:

jobs:
  sync-config:
    name: Sync to Production Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Sync nginx config to server
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" \
            scp -o StrictHostKeyChecking=no \
            nginx/lexiang.conf \
            nginx/yefeng-us-cc.production.conf \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/etc/nginx/conf.d/

      - name: Test and reload nginx
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" \
            ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            'sudo nginx -t && sudo systemctl reload nginx && echo "Nginx reloaded successfully"'
