# ============================================================
# 乐享 IM - Nginx 反向代理配置
# 作用: 反向代理 im-server 的 API / WebSocket / 管理后台
# 部署: 放置于 /etc/nginx/conf.d/lexiang.conf
# 前置: 域名已解析到服务器, SSL 证书已配置 (或使用 Cloudflare 代理)
# ============================================================

# ---------- WebSocket 升级映射 ----------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------- 限流区域 (可选, 防刷) ----------
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ============================================================
# API + WebSocket 域名 (api.lexiang.com)
# ============================================================
server {
    listen 80;
    server_name api.lexiang.com;

    # HTTP 强制跳转 HTTPS (如果使用 Cloudflare 代理可省略)
    # return 301 https://$host$request_uri;

    # ---------- 通用配置 ----------
    client_max_body_size 50m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # ---------- CORS (前端域名) ----------
    add_header Access-Control-Allow-Origin "https://app.lexiang.com" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "appkey, Authorization, Content-Type, version, request-id" always;
    add_header Access-Control-Expose-Headers "request-id" always;
    add_header Access-Control-Max-Age "86400" always;

    # OPTIONS 预检请求直接返回
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ---------- 业务 API (9003) ----------
    location /jim/ {
        limit_req zone=api_limit burst=200 nodelay;
        limit_conn conn_limit 50;

        proxy_pass http://127.0.0.1:9003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 传递自定义 header (appkey / Authorization)
        proxy_pass_request_headers on;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # ---------- WebSocket 连接 (9003) ----------
    location /im/ {
        proxy_pass http://127.0.0.1:9003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接超时
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ---------- API 网关 (9001) ----------
    location /api/ {
        limit_req zone=api_limit burst=200 nodelay;

        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- 健康检查 ----------
    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}

# ============================================================
# 管理后台域名 (admin.lexiang.com)
# ============================================================
server {
    listen 80;
    server_name admin.lexiang.com;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # ---------- 管理后台 API (8090) ----------
    location /admingateway/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- 管理后台前端静态资源 (8090 内嵌) ----------
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://127.0.0.1:8090;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}

