# ============================================================
# 乐享 IM 前端 - Cloudflare Pages 部署配置
# 文件名: wrangler.toml (放置于 jugglechat-web 根目录)
# 部署命令: npx wrangler pages deploy dist --project-name=lexiang-im
# ============================================================

name = "lexiang-im"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

# 构建配置
[build]
command = "npm run build"
build_dir = "dist"

# 环境变量 (在 Cloudflare Dashboard 中也可配置)
[env.production.vars]
VITE_API_HOST = "api.lexiang.com"
VITE_WS_HOST = "wss://api.lexiang.com"
VITE_ADMIN_HOST = "admin.lexiang.com"

# 自定义域名 (在 Cloudflare Dashboard 中绑定)
# [[env.production.domains]]
# domain = "app.lexiang.com"
